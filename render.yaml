services:
  - type: web
    name: metar-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_COOKIE
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.0"
    plan: free
